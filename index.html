<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcule sua gorjeta</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Cálculo de fatura TIM</h1>
    <p>Calcule o valor do troco</p>
    
    <br>

    <div>
        <label for="precoo">Preço utilitario</label>
        <input type="number" name="precoo" id="preco" placeholder="valor utilitario">
    </div>

    <div>
        <label for="qtd">Quantidade comprada</label>
        <input type="number" name="qtd" id="quantidade" placeholder="Quantidade comprada">
    </div>

    <div>
        <label for="recebido">Dinheiro recebido</label>
        <input type="number" name="recebido" id="DRecebido" placeholder="Dinheiro a se receber">
    </div>

    <p id="resultado"></p>

    <button>Calcular</button>

    <p id="resultado"></p>
</body>
</html>
